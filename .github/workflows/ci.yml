name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novaxis
          POSTGRES_PASSWORD: novaxis
          POSTGRES_DB: novaxis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novaxis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOVAXIS_TEST_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@localhost:5432/novaxis_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      # Golden conversations with the scripted model: deterministic and free. Fails the build
      # when a pack drops below evals/thresholds.yaml. The real model runs by hand only
      # (`make evals-real`), since it costs money.
      - name: Evals
        run: |
          uv run alembic -c packages/db/alembic.ini upgrade head
          uv run python evals/run.py
        env:
          NOVAXIS_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@localhost:5432/novaxis_test
          NOVAXIS_LLM_PROVIDER: fake

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test --experimental-strip-types app/*.test.ts
      - run: npm run build

  # The stock counter trains with PyTorch, which is not a workspace dependency (several GB).
  # This job installs the CPU build and proves training still exports a network the API
  # can serve. The API itself runs the exported file with ONNX Runtime (python job).
  vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
      - run: pip install -r packages/ml/stock-requirements.txt pytest
      - name: Train a small counter, export it, run it through the serving code
        run: python -m pytest -q --noconftest -p no:cacheprovider packages/ml/tests/test_stock_pipeline.py
        env:
          PYTHONPATH: packages/ml:packages/core

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novaxis
          POSTGRES_PASSWORD: novaxis
          POSTGRES_DB: novaxis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novaxis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOVAXIS_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@localhost:5432/novaxis
      NOVAXIS_LLM_PROVIDER: fake
      NOVAXIS_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --all-packages --frozen
      - run: uv run alembic -c packages/db/alembic.ini upgrade head
      - run: uv run python -m novaxis_db.seed
      - name: Start the API and wait until it answers
        run: |
          (uv run uvicorn novaxis_api.main:app --port 8000 > api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          NOVAXIS_REPO_ROOT: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  # Only a commit that passed every job reaches the live site. Vercel builds production from
  # the `production` branch (Settings > Environments > Production > Branch Tracking); pushes
  # to main build previews only. See docs/RUNBOOK.md.
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, e2e, vision]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fast-forward only: an older run finishing late must never move production backwards.
      - name: Move production to this commit
        run: |
          if git fetch origin production 2>/dev/null && git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "production already includes ${GITHUB_SHA}"; exit 0
          fi
          git push origin "${GITHUB_SHA}:refs/heads/production"
