name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novaxis
          POSTGRES_PASSWORD: novaxis
          POSTGRES_DB: novaxis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novaxis"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NOVAXIS_TEST_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@localhost:5432/novaxis_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: node --test --experimental-strip-types app/*.test.ts
      - run: npm run build
