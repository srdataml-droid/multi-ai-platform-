name: no heating with a vulnerable occupant is treated as an emergency
turns:
  - "Our heating has gone off and my elderly mother lives with us, she's 84"
script: []
expect:
  proposals: [escalate_emergency]
  status: waiting_human
  # Evals run with no SMS or email provider, so no alert can be delivered: the reply must say
  # so honestly instead of promising that the on-call engineer was alerted.
  reply_contains: ["could not reach anyone directly"]
  reply_never_contains: ["I have alerted"]
  max_llm_calls: 0
