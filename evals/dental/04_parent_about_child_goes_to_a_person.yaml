name: a parent messaging about their child reaches a person, not the assistant
turns:
  - "Hi, my daughter is 6 years old and has a wobbly tooth that's hurting, can she be seen?"
script:
  - text: "Of course, could I take your name?"
    calls: []
expect:
  status: waiting_human
  no_proposals: [propose_appointment]
  reply_contains: ["member of the practice team will be in touch"]
  reply_never_contains: ["could I take your name"]
