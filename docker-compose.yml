services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novaxis
      POSTGRES_PASSWORD: novaxis
      POSTGRES_DB: novaxis
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaxis"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      NOVAXIS_ENV: local
      NOVAXIS_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@postgres:5432/novaxis
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
    develop:
      watch:
        - action: sync+restart
          path: ./apps/api
          target: /app/apps/api
        - action: sync+restart
          path: ./packages
          target: /app/packages

  worker:
    build: .
    command: ["novaxis-worker"]
    environment:
      NOVAXIS_ENV: local
      NOVAXIS_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@postgres:5432/novaxis
    depends_on:
      postgres: { condition: service_healthy }
    develop:
      watch:
        - action: sync+restart
          path: ./apps/worker
          target: /app/apps/worker
        - action: sync+restart
          path: ./packages
          target: /app/packages

  web:
    build: ./apps/web
    environment:
      NOVAXIS_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

  # Runs the Python test suite inside the same image: `make test-docker`.
  test:
    build: .
    profiles: [test]
    command: ["sh", "-c", "uv sync --all-packages --frozen && uv run pytest -q"]
    environment:
      NOVAXIS_ENV: test
      NOVAXIS_DATABASE_URL: postgresql+psycopg://novaxis:novaxis@postgres:5432/novaxis
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
