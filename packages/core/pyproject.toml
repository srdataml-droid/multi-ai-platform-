[project]
name = "novaxis-core"
version = "0.0.0"
description = "Domain models, risk rules, approval gate, executors, integration SDK"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "httpx>=0.27", "anthropic>=1.8", "pyyaml>=6.0", "cryptography>=43", "pywebpush>=2.0", "numpy>=2.0", "pillow>=10.4", "onnxruntime>=1.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novaxis_core"]
