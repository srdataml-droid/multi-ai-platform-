[project]
name = "novaxis-core"
version = "0.0.0"
description = "Domain models, risk rules, approval gate, executors, integration SDK"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "pydantic-settings>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novaxis_core"]
