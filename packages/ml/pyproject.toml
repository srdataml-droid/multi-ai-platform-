[project]
name = "novaxis-ml"
version = "0.0.0"
description = "Training pipelines for Novaxis models. Runs on a laptop or in CI, never in the API."
requires-python = ">=3.12"
dependencies = ["novaxis-core", "novaxis-db", "numpy>=2.0", "scikit-learn>=1.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novaxis_ml"]
