[project]
name = "novaxis-db"
version = "0.0.0"
description = "Migrations, RLS policies, seed data"
requires-python = ">=3.12"
dependencies = ["novaxis-core", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novaxis_db"]
