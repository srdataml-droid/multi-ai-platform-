[project]
name = "novaxis-platform"
version = "0.0.0"
description = "Novaxis AI Worker Platform workspace root"
requires-python = ">=3.12"
# The API's third-party runtime dependencies, flattened. Vercel reads this file to build
# the API function; workspace packages are added to sys.path by vercel_app.py.
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "anthropic>=1.8",
  "pyyaml>=6.0",
  "cryptography>=43",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "pywebpush>=2.0",
]

[tool.vercel]
entrypoint = "vercel_app:app"

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core", "packages/packs", "packages/db"]

[tool.uv.sources]
novaxis-worker = { workspace = true }
novaxis-core = { workspace = true }
novaxis-packs = { workspace = true }
novaxis-db = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/*", "packages/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["novaxis_core", "novaxis_db"]
mypy_path = "packages/core:packages/db"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]

[[tool.mypy.overrides]]
module = ["pywebpush", "py_vapid"]
ignore_missing_imports = true
