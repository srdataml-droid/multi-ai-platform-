[project]
name = "novaxis-platform"
version = "0.0.0"
description = "Novaxis AI Worker Platform workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core", "packages/packs", "packages/db"]

[tool.uv.sources]
novaxis-core = { workspace = true }
novaxis-packs = { workspace = true }
novaxis-db = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/*", "packages/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["novaxis_core", "novaxis_db"]
mypy_path = "packages/core:packages/db"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps", "packages"]
