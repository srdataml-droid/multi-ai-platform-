[project]
name = "novaxis-worker"
version = "0.0.0"
description = "Job runner: picks jobs, runs worker turns, executes approved actions"
requires-python = ">=3.12"
dependencies = ["novaxis-core", "novaxis-db", "novaxis-packs"]

[project.scripts]
novaxis-worker = "novaxis_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novaxis_worker"]
