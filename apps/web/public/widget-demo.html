<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Widget demo</title></head>
<body style="font-family: system-ui, sans-serif; padding: 2rem; max-width: 40rem">
  <h1 id="business">Demo Heating &amp; Cooling</h1>
  <p>This page stands in for a customer's website. The chat bubble at the bottom right is the Novaxis widget, installed with one script tag.</p>
  <p style="color: #555">Other demo businesses: <a href="?business=demo-hvac">heating</a> · <a href="?business=demo-dental">dental</a> · <a href="?business=demo-restoration">restoration</a></p>
  <script>
    // ?business=<demo slug> picks which demo business the widget talks to. Only the demo
    // businesses are offered, so this page cannot be pointed at a real one.
    (function () {
      var names = {
        "demo-hvac": "Demo Heating & Cooling",
        "demo-dental": "Demo Dental Practice",
        "demo-restoration": "Demo Restoration Services",
      };
      var slug = new URLSearchParams(location.search).get("business");
      if (!Object.prototype.hasOwnProperty.call(names, slug)) slug = "demo-hvac";
      document.getElementById("business").textContent = names[slug];
      var s = document.createElement("script");
      s.src = "/widget.js";
      s.setAttribute("data-tenant", slug);
      s.setAttribute("data-api", "/api");
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
